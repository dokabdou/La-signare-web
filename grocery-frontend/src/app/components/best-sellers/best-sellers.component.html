<div class="page-container">
  <div class="page-header">
    <h2>Meilleures Ventes</h2>
    <p>Découvrez nos articles les plus populaires, regroupant le meilleur de chaque catégorie.</p>
  </div>

  <div class="product-grid" *ngIf="bestSellers.length > 0; else empty">
    <div class="product-card" *ngFor="let product of bestSellers" (click)="goToProduct(product.id)">
      <div class="badge top">TOP</div>
      <div class="img-container">
        <img [src]="product.imageUrl || 'assets/placeholder.jpg'" [alt]="product.name">
      </div>
      <div class="card-info">
        <span class="cat-label">{{ product.category | uppercase }}</span>
        <h3>{{ product.name }}</h3>
        <p class="price"><strong>{{ product.price | number:'1.2-2' }} €</strong></p>
        <button class="add-btn" 
                [ngClass]="{'out-of-stock': product.quantity < 5}" 
                [disabled]="product.quantity < 5"
                (click)="addToCart($event, product)">
          {{ product.quantity < 5 ? 'Stock épuisé' : 'Ajouter au panier' }}
        </button>
      </div>
    </div>
  </div>

  <ng-template #empty>
    <div class="empty-state">Chargement des meilleures ventes...</div>
  </ng-template>
</div>
