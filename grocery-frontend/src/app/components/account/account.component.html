<div class="account-container">
  <div class="account-card">
    <h2>My Account</h2>
    <p class="subtitle">Update your personal information.</p>

    <div class="info-group">
      <label>Full Name</label>
      <input type="text" [value]="user?.name" disabled class="disabled-input">
    </div>

    <div class="info-group">
      <label>Email Address</label>
      <input type="text" [value]="user?.email" disabled class="disabled-input">
    </div>

    <div *ngIf="message && !message.includes('empty')" class="success-msg">{{ message }}</div>
    <div *ngIf="message && message.includes('empty')" class="error-msg">{{ message }}</div>

    <form (ngSubmit)="save()">
      <div class="info-group">
        <label>Phone Number</label>
        <input type="text" [(ngModel)]="phone" name="phone" placeholder="Enter phone number">
      </div>

      <div class="info-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" required>
      </div>

      <button type="submit" class="save-btn" [disabled]="loading">
        {{ loading ? 'Saving Changes...' : 'Save Changes' }}
      </button>
    </form>
  </div>
</div>
