<div class="app-layout">

  <app-navbar></app-navbar>

  <div class="global-toast no-print" *ngIf="toastMessage" (click)="closeToast()">
    {{ toastMessage }}
  </div>

  <div class="main-content">
    <router-outlet></router-outlet>
  </div>

  <button class="scroll-to-top-btn no-print" *ngIf="showScrollBtn" (click)="scrollToTop()" title="Retour en haut">↑</button>

  <footer class="main-footer no-print">
    <div class="footer-col">
      <h3>🛒 La Signare - Épicerie du Monde</h3>
      <p>📞 +33 6 36 02 23 91</p>
      <p>✉️<a href="mailto:contact@lasignare.fr" class="contact-link">lasignare.vire@gmail.com</a></p>
      <p>
        📍
        <a href="https://maps.google.com/?q=LA+SIGNARE+Épicerie+Du+Monde,+11+Rue+de+Bernières,+14000+Caen"
           target="_blank"
           rel="noopener noreferrer"
           class="map-link">
          11 Rue de Bernières, 14000 Caen
        </a>
      </p>
      <p>🛒 Ouvert 7j/7</p>
    </div>

    <div class="footer-col">
      <h3>Nos produits</h3>
      <ul *ngIf="categories$ | async as cats">
        <li *ngFor="let cat of cats | slice:0:6">
          <a (click)="goToCategory(cat)" style="cursor:pointer">{{ cat | titlecase }}</a>
        </li>
      </ul>
    </div>
  </footer>

</div>
