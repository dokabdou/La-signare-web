<app-navbar></app-navbar>

<div class="global-toast no-print" *ngIf="toastMessage" (click)="closeToast()">
  {{ toastMessage }}
</div>

<div class="main-content">
  <router-outlet></router-outlet>
</div>

<button class="scroll-to-top-btn no-print" *ngIf="showScrollBtn" (click)="scrollToTop()" title="Go to top">↑</button>

<footer class="main-footer no-print">
  <div class="footer-col">
    <h3>🛒 La signare - Épicerie du Monde</h3>
    <p>📞 +33 6 36 02 23 91</p>
    <p>✉️ email@example.com</p>
    <p>
      📍 
      <a href="https://maps.google.com/?q=LA+SIGNARE+Épicerie+Du+Monde,+11+Rue+de+Bernières,+14000+Caen" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="map-link">
        11 Rue de Bernières, 14000 Caen
      </a>
    </p>
  </div>
  
  <div class="footer-col">
    <h3>Our Products</h3>
    <ul *ngIf="categories$ | async as cats">
      <li *ngFor="let cat of cats | slice:0:6">
        <a (click)="goToCategory(cat)" style="cursor:pointer">{{ cat | titlecase }}</a>
      </li>
    </ul>
  </div>
  
  <div class="footer-col">
    <h3>Learn More</h3>
    <ul>
      <li><a routerLink="/">Contact Us</a></li>
      <li><a routerLink="/">Legal Notice</a></li>
      <li><a routerLink="/">Delivery</a></li>
      <li><a routerLink="/">Terms & Conditions</a></li>
    </ul>
  </div>
</footer>
